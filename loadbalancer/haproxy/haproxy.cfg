global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_frontend
    bind 127.0.0.1:8000
    default_backend frontend_servers

backend frontend_servers
    balance roundrobin

    option httpchk GET /

    server frontend1 <PRIVATE_IP>:80 check
    server frontend2 <PRIVATE_IP>:80 check
